services:
  # ==========================================
  # 1. PRAHAR FastAPI Backend Core Engine
  # ==========================================
  - type: web
    name: prahar-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

  # ==========================================
  # 2. PRAHAR React 18 + Vite Operations Cockpit (Static Site)
  # ==========================================
  - type: web
    name: prahar-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: prahar-backend
          property: host

  # ==========================================
  # 3. Data Ingestion Microservice (:8001)
  # ==========================================
  - type: worker
    name: prahar-ingestion
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: services/ingestion
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8001
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
